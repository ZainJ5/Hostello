# NGINX site for hostello.tech.
# Installed to /etc/nginx/sites-available/hostello.conf and symlinked into
# sites-enabled. Reload with: nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # `_` keeps the site reachable by bare IP while DNS for hostello.tech is
    # still being pointed. It can be dropped once the domain resolves.
    server_name hostello.tech www.hostello.tech _;

    # Matches next.config.mjs serverActions.bodySizeLimit (8mb), so a rejected
    # upload fails in the app with a real message instead of an NGINX 413.
    client_max_body_size 8m;

    access_log /var/log/nginx/hostello.access.log;
    error_log  /var/log/nginx/hostello.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ─── Private files ────────────────────────────────────────────────
    # Payment screenshots are written under public/ by the upload handler, but
    # they are sensitive. They must only ever be read through the authenticated
    # /api/owner/payments/[id]/screenshot route, which reads them from disk
    # directly. Blocking the path here keeps the static copy unreachable.
    # `^~` outranks the /uploads/ prefix below.
    location ^~ /uploads/payments/ {
        access_log off;
        return 404;
    }

    # ─── Listing photography ──────────────────────────────────────────
    # ~100MB of restored photos served straight off disk, never touching Node.
    location ^~ /uploads/ {
        alias /var/www/hostello/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ─── Immutable build assets ───────────────────────────────────────
    # Content-hashed by Next, so they can be cached for a year.
    location ^~ /_next/static/ {
        alias /var/www/hostello/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Application ──────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Empty Connection header enables upstream keep-alive.
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
