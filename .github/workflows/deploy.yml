name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Queued rather than cancelled, so a run never stops
# halfway through replacing the release on the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    # A real MongoDB, so the build behaves the way it does on the server.
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/hostello_ci
          # Build-time placeholder only. The real secret lives in .env.local on
          # the server and is never needed here.
          AUTH_SECRET: ci_build_placeholder_secret_not_used_at_runtime_0123456789
          NEXT_PUBLIC_SITE_URL: https://hostello.tech
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              deploy

      - name: Verify site is serving
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://hostello.tech/)
          echo "homepage returned HTTP $code"
          test "$code" = "200"
