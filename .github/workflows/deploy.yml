name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Queued rather than cancelled, so a run never stops
# halfway through replacing the release on the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    # A real MongoDB, so the build behaves the way it does on the server.
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/hostello_ci
          # Build-time placeholder only. The real secret lives in .env.local on
          # the server and is never needed here.
          AUTH_SECRET: ci_build_placeholder_secret_not_used_at_runtime_0123456789
          NEXT_PUBLIC_SITE_URL: https://hostello.tech
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy
        # Reaching port 22 from GitHub's runners is occasionally blocked
        # upstream of the host: the connection times out rather than being
        # refused, and a later attempt from a different runner IP succeeds.
        # Retry before giving up so a network blip does not fail a good deploy.
        run: |
          set -u
          attempts=5
          for i in $(seq 1 $attempts); do
            echo "::group::deploy attempt $i/$attempts"
            # `|| status=$?` rather than an `if`: after a failed `if` condition
            # with no `else`, `$?` is the status of the `if` itself, which is 0.
            # Reading it there made every failure look like a clean exit, so
            # the retry below never ran and the step passed while nothing had
            # been deployed. Run 19 died exactly this way.
            status=0
            ssh -i ~/.ssh/deploy_key \
                -o IdentitiesOnly=yes \
                -o BatchMode=yes \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=20 \
                "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                deploy || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "deploy succeeded on attempt $i"
              exit 0
            fi
            # 255 is ssh's own transport failure; anything else came from the
            # deploy script itself and retrying would not help.
            if [ "$status" -ne 255 ]; then
              echo "deploy script failed with exit $status, not retrying"
              exit "$status"
            fi
            echo "ssh transport failed (exit 255)"
            [ "$i" -lt "$attempts" ] && sleep 30
          done
          echo "could not reach the host after $attempts attempts"
          exit 1

      - name: Verify site is serving
        # The server is still restarting when `deploy` returns, so a single
        # request races the boot and reports a failure on a deploy that worked.
        # Poll, and only call it down when it is still not answering after two
        # minutes. This is a second opinion, not the main guard: a deploy that
        # does not happen now fails the step above on its own.
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://hostello.tech/ || echo 000)
            echo "attempt $i: homepage returned HTTP $code"
            if [ "$code" = "200" ]; then
              echo "site is serving"
              exit 0
            fi
            sleep 10
          done
          echo "site did not answer with 200 within two minutes"
          exit 1
